name: Validate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.14"
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Lint Python
        run: python -m ruff check .
      - name: Compile Python
        run: python -m compileall -q skills tests
      - name: Validate maintained example
        run: >-
          python skills/architecture-hygiene-audit/scripts/validate_ledger.py
          --inventory examples/architecture-hygiene-audit/inventory.json
          --ledger examples/architecture-hygiene-audit/ledger.json
