name: Skill proposal
description: Propose a new skill or a material behavior change to an existing skill.
title: "[Skill proposal]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What recurring agent task is currently unreliable, unsafe, or unnecessarily difficult?
    validations:
      required: true
  - type: textarea
    id: triggers
    attributes:
      label: Trigger language
      description: Give realistic user prompts that should invoke the skill and nearby prompts that should not.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Expected output and evidence
      description: Describe the artifact or outcome and how a reviewer can tell it is correct.
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Proposed workflow
      description: Outline required tools, decisions, failure handling, and completion gates.
    validations:
      required: true
  - type: dropdown
    id: side-effects
    attributes:
      label: Side effects
      options:
        - Read-only analysis
        - Local repository writes
        - External writes or messages
        - Deployment or other high-impact action
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and portability
      description: Name required runtimes, clients, operating systems, and known limitations.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Existing tools or alternatives
      description: Link related skills or tools and explain why they do not cover the proposed outcome.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Proposal checks
      options:
        - label: I can provide behavioral scenarios or evaluation evidence.
          required: true
        - label: I have identified any third-party material and its license.
          required: true
